<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tasks - Perks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-dark: #0a0a0f;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-cyan: #00f2ff;
            --neon-cyan-glow: rgba(0, 242, 255, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #b4b4b4;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --green: #10b981;
            --yellow: #fbbf24;
            --purple: #a855f7;
            --orange: #f97316;
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-dark); color: var(--text-primary); overflow-x: hidden; min-height: 100vh; padding: 20px; padding-bottom: 110px; -webkit-font-smoothing: antialiased; }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .bg-animation::before { content: ''; position: absolute; width: 200%; height: 200%; background: radial-gradient(circle at 20% 50%, rgba(0, 242, 255, 0.1) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(147, 51, 234, 0.1) 0%, transparent 50%), radial-gradient(circle at 40% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%); animation: bgFloat 20s ease-in-out infinite; }
        @keyframes bgFloat { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 33% { transform: translate(50px, 50px) rotate(120deg); } 66% { transform: translate(-50px, 100px) rotate(240deg); } }
        #canvas3d { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }
        .container { max-width: 600px; margin: 0 auto; }
        .header h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, var(--neon-cyan), #9333ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .balance-display { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 15px 20px; display: flex; align-items: center; gap: 10px; font-size: 16px; box-shadow: var(--card-shadow); transition: all 0.3s ease; }
        .balance-display:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0, 242, 255, 0.2); }
        .balance-display i { color: var(--yellow); font-size: 24px; }
        .balance-display span { color: var(--text-secondary); }
        .balance-display .currency { color: var(--neon-cyan); font-weight: 700; font-size: 20px; margin: 0 5px; }
        #messageContainer { margin-bottom: 20px; }
        .message { padding: 16px 20px; border-radius: 16px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 12px; animation: slideIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); backdrop-filter: blur(12px); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .message.success { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid var(--green); }
        .message.error { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; }
        .loading, .empty-state { text-align: center; padding: 60px 20px; background: var(--glass-bg); backdrop-filter: blur(12px); border-radius: 24px; border: 1px dashed var(--glass-border); color: var(--text-secondary); }
        .loading i, .empty-state i { font-size: 48px; color: var(--neon-cyan); margin-bottom: 20px; display: block; }
        .loading i { animation: spin 1.5s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state h3 { margin: 0 0 10px 0; color: var(--text-primary); font-size: 20px; }
        .tasks-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
        .task-card { background: var(--glass-bg); backdrop-filter: blur(12px); border-radius: 20px; padding: 24px; border: 1px solid var(--glass-border); box-shadow: var(--card-shadow); display: flex; align-items: center; gap: 18px; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); position: relative; overflow: hidden; transform-style: preserve-3d; }
        .task-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(0, 242, 255, 0.1), transparent); transform: rotate(45deg); transition: all 0.6s ease; }
        .task-card:hover::before { left: 100%; }
        .task-card:hover { transform: translateY(-5px) rotateX(2deg); box-shadow: 0 15px 50px rgba(0, 242, 255, 0.3); border-color: var(--neon-cyan); }
        .task-card.completed { opacity: 0.7; border-color: var(--green); }
        .task-card.daily-bonus { border-color: var(--yellow); background: linear-gradient(135deg, var(--glass-bg), rgba(251, 191, 36, 0.05)); }
        .task-card.watch-ads { border-color: var(--purple); background: linear-gradient(135deg, var(--glass-bg), rgba(168, 85, 247, 0.05)); }
        .task-icon { font-size: 42px; min-width: 60px; text-align: center; position: relative; z-index: 2; background: linear-gradient(135deg, var(--neon-cyan), #9333ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: iconPulse 3s ease-in-out infinite; }
        @keyframes iconPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .task-card.completed .task-icon { background: linear-gradient(135deg, var(--green), #059669); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .task-card.daily-bonus .task-icon { background: linear-gradient(135deg, var(--yellow), #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .task-card.watch-ads .task-icon { background: linear-gradient(135deg, var(--purple), #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .task-info { flex: 1; position: relative; z-index: 2; }
        .task-title { font-size: 17px; font-weight: 700; margin: 0 0 6px 0; color: var(--text-primary); }
        .task-description { font-size: 13px; color: var(--text-secondary); margin: 0 0 10px 0; line-height: 1.5; }
        .task-reward { font-size: 15px; color: var(--yellow); font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .task-action { display: flex; flex-direction: column; gap: 10px; min-width: 110px; position: relative; z-index: 2; }
        .btn-task { padding: 12px 18px; font-size: 14px; font-weight: 700; border-radius: 12px; border: none; cursor: pointer; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; position: relative; overflow: hidden; text-transform: uppercase; letter-spacing: 0.5px; font-size: 12px; }
        .btn-task::before { content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.3); transform: translate(-50%, -50%); transition: width 0.6s, height 0.6s; }
        .btn-task:active::before { width: 300px; height: 300px; }
        .btn-start { background: linear-gradient(135deg, var(--neon-cyan), #0ea5e9); color: white; box-shadow: 0 4px 15px var(--neon-cyan-glow); }
        .btn-start:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 25px var(--neon-cyan-glow); }
        .btn-verify, .btn-claim { background: linear-gradient(135deg, var(--yellow), #f59e0b); color: var(--bg-dark); box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4); }
        .btn-verify:hover:not(:disabled), .btn-claim:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(251, 191, 36, 0.6); }
        .btn-watch-ad { background: linear-gradient(135deg, var(--purple), #7c3aed); color: white; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); }
        .btn-watch-ad:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(168, 85, 247, 0.6); }
        .btn-claimed, .btn-completed { background: transparent; color: var(--text-secondary); border: 1px solid var(--glass-border); cursor: default; }
        .btn-completed { background: linear-gradient(135deg, var(--green), #059669); color: white; border: none; }
        .btn-task:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
        .btn-task.loading { position: relative; pointer-events: none; }
        .btn-task.loading > * { visibility: hidden; }
        .btn-task.loading::after { content: ''; position: absolute; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; top: 50%; left: 50%; margin-left: -8px; margin-top: -8px; visibility: visible; }
        .completed-badge { position: absolute; top: 12px; right: 12px; background: linear-gradient(135deg, var(--green), #059669); color: white; font-size: 11px; padding: 6px 12px; border-radius: 20px; font-weight: 700; display: flex; align-items: center; gap: 5px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); text-transform: uppercase; letter-spacing: 0.5px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(12px); border-top: 1px solid var(--glass-border); padding: 12px 20px 20px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.6); }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 8px; margin: 0 5px; cursor: pointer; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); text-decoration: none; color: var(--text-secondary); position: relative; overflow: hidden; }
        .nav-btn:hover { transform: translateY(-8px) scale(1.05); box-shadow: 0 8px 25px var(--neon-cyan-glow); }
        .nav-btn.active { background: rgba(0, 242, 255, 0.15); border-color: var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 25px var(--neon-cyan-glow), inset 0 0 20px rgba(0, 242, 255, 0.1); transform: translateY(-5px); }
        .nav-icon { font-size: 22px; position: relative; z-index: 2; transition: all 0.3s ease; }
        .nav-label { font-size: 11px; font-weight: 600; position: relative; z-index: 2; text-transform: uppercase; letter-spacing: 0.5px; }
        .telegram-warning { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; padding: 20px; border-radius: 16px; text-align: center; margin: 20px 0; }
        .telegram-warning i { font-size: 48px; margin-bottom: 15px; display: block; }
        @media (max-width: 380px) { .task-card { padding: 18px; flex-direction: column; text-align: center; } .task-action { width: 100%; min-width: auto; } .btn-task { width: 100%; } }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <canvas id="canvas3d"></canvas>
    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-list-check"></i> Tasks</h1>
            <div class="balance-display">
                <i class="fa-solid fa-coins"></i>
                <span>Balance:</span>
                <span class="currency" id="userBalance">0.00000000</span>
                <span>Perks</span>
            </div>
        </div>

        <div id="messageContainer"></div>

        <div id="tasksContainer">
            <div class="loading">
                <i class="fa-solid fa-spinner"></i>
                <p>Loading tasks...</p>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-btn">
            <i class="fa-solid fa-house nav-icon"></i>
            <span class="nav-label">Home</span>
        </a>
        <a href="tasks.html" class="nav-btn active">
            <i class="fa-solid fa-list-check nav-icon"></i>
            <span class="nav-label">Tasks</span>
        </a>
        <a href="withdraw.html" class="nav-btn">
            <i class="fa-solid fa-wallet nav-icon"></i>
            <span class="nav-label">Withdraw</span>
        </a>
        <a href="invite.html" class="nav-btn">
            <i class="fa-solid fa-user-group nav-icon"></i>
            <span class="nav-label">Invite</span>
        </a>
    </nav>

<script>
        const SUPABASE_URL = 'https://xxontbljncxjvznrxnkv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4b250YmxqbmN4anZ6bnJ4bmt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE5NDY5MzUsImV4cCI6MjA3NzUyMjkzNX0.vK5cqDjisZ-u5peKFBnVQEsPDcSTqjx9uIni9J7S0p4';
        const BOT_TOKEN = '8219579371:AAHWS8i_5ZAFUlFMI4BZvGwhqdGBORYsC5w';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let currentUser = null;
        let allTasks = [];
        let completedTaskIds = new Set();
        let activeAds = [];
        let watchedAdIds = new Set();
        let appSettings = {};

        function setButtonLoading(button, isLoading) {
            if (isLoading) { button.classList.add('loading'); button.disabled = true; }
            else { button.classList.remove('loading'); button.disabled = false; }
        }

        function checkTelegramEnvironment() {
            if (!tg.initDataUnsafe || !tg.initDataUnsafe.user) {
                document.getElementById('tasksContainer').innerHTML = `
                    <div class="telegram-warning">
                        <i class="fa-brands fa-telegram"></i>
                        <h3>Telegram Required</h3>
                        <p>This app must be opened through Telegram. Please open it via your Telegram bot.</p>
                    </div>`;
                return false;
            }
            return true;
        }

        function init3DBackground() { /* ... unchanged ... */ }

        function showMessage(message, type = 'success') { /* ... unchanged ... */ }
        function showLoadingError(message) { /* ... unchanged ... */ }
        function getUserId() { return tg.initDataUnsafe?.user?.id || null; }
        function updateBalanceDisplay() { if (currentUser) document.getElementById('userBalance').textContent = parseFloat(currentUser.balance || 0).toFixed(8); }

        async function fetchSettings() { /* ... unchanged ... */ }
        async function fetchUser() { /* ... unchanged ... */ }

        async function fetchTasks() {
            try {
                const { data, error } = await supabase
                    .from('tasks')
                    .select('id, title, description, reward, task_type, task_url, channel_username, icon, is_active')
                    .eq('is_active', true)
                    .order('created_at', { ascending: false });
                if (error) throw error;
                return data || [];
            } catch (err) { console.error('Error fetching tasks:', err); throw err; }
        }

        async function fetchCompletedTasks() {
            try {
                const telegramId = getUserId();
                const { data, error } = await supabase
                    .from('user_tasks')
                    .select('task_id')
                    .eq('user_id', telegramId)
                    .eq('status', 'completed');
                if (error) throw error;
                return data ? data.map(item => item.task_id) : [];
            } catch (err) {
                console.error('Error fetching completed tasks:', err);
                return [];
            }
        }

        async function fetchActiveAds() { /* ... unchanged ... */ }

        async function markTaskCompleted(taskId, reward) { /* ... unchanged ... */ }
        function canClaimDailyBonus() { /* ... unchanged ... */ }
        async function claimDailyBonus() { /* ... unchanged ... */ }
        async function recordAdWatch(adId, reward) { /* ... unchanged ... */ }
        function loadAdSDK(zoneId, sdkName) { /* ... unchanged ... */ }

        function extractTelegramUsernameOrCode(link) { /* ... unchanged ... */ }
        async function verifyBotIsAdmin(chatIdentifier) { /* ... unchanged ... */ }
        async function verifyTelegramMembership(chatId, userId) { /* ... unchanged ... */ }

        function renderDailyBonusCard() { /* ... unchanged ... */ }
        function renderAdCard(ad) { /* ... unchanged ... */ }

        function renderTaskCard(task) {
            const isCompleted = completedTaskIds.has(task.id);
            const cardClass = isCompleted ? 'task-card completed' : 'task-card';
            const icon = task.icon || 'fa-tasks';
            const taskUrl = (task.task_url || '').replace(/'/g, "\\'");
            const taskType = (task.task_type || '').replace(/'/g, "\\'");
            const channelUsername = (task.channel_username || '').replace(/'/g, "\\'");

            return `
            <div class="${cardClass}" data-task-id="${task.id}" data-channel-username="${channelUsername}">
                ${isCompleted ? '<div class="completed-badge"><i class="fa-solid fa-check"></i> Done</div>' : ''}
                <div class="task-icon">
                    <i class="fa-solid ${icon}"></i>
                </div>
                <div class="task-info">
                    <h3 class="task-title">${task.title}</h3>
                    <p class="task-description">${task.description || 'Complete this task to earn rewards'}</p>
                    <div class="task-reward">
                        <i class="fa-solid fa-coins"></i>
                        <span>+${parseFloat(task.reward || 0).toFixed(8)} Perks</span>
                    </div>
                </div>
                <div class="task-action">
                    ${isCompleted ?
                        '<button class="btn-task btn-completed" disabled><i class="fa-solid fa-check"></i> Done</button>' :
                        `<button class="btn-task btn-start" onclick="startTask(${task.id}, '${taskUrl}', '${taskType}', this)">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> Start
                        </button>
                        <button class="btn-task btn-verify" onclick="verifyTask(${task.id}, '${taskUrl}', '${taskType}', ${task.reward}, this, '${channelUsername}')" style="display: none;">
                            <i class="fa-solid fa-circle-check"></i> Verify
                        </button>`
                    }
                </div>
            </div>`;
        }

        function renderTasks() { /* ... unchanged ... */ }

        window.handleClaimBonus = async function(button) { /* ... unchanged ... */ }
        window.handleWatchAd = async function(adId, zoneId, sdkName, reward, button) { /* ... unchanged ... */ }

        window.startTask = function(taskId, link, taskType, button) {
            const card = document.querySelector(`[data-task-id="${taskId}"]`);
            const startBtn = card.querySelector('.btn-start');
            const verifyBtn = card.querySelector('.btn-verify');

            setButtonLoading(startBtn, true);

            try {
                if (taskType === 'join_channel' || taskType === 'join_group' || taskType === 'social') {
                    tg.openTelegramLink(link);
                } else {
                    tg.openLink(link);
                }

                setTimeout(() => {
                    setButtonLoading(startBtn, false);
                    startBtn.style.display = 'none';
                    verifyBtn.style.display = 'flex';
                }, 2000);
            } catch (err) {
                console.error('Error starting task:', err);
                showMessage('Failed to open link. Please try again.', 'error');
                setButtonLoading(startBtn, false);
            }
        };

        // UPDATED verifyTask WITH CHANNEL TRACKING
        window.verifyTask = async function(taskId, link, taskType, reward, button, channelUsername) {
            const card = document.querySelector(`[data-task-id="${taskId}"]`);
            const verifyBtn = card.querySelector('.btn-verify');

            setButtonLoading(verifyBtn, true);

            try {
                let verified = false;

                if (taskType === 'join_channel' || taskType === 'join_group' || taskType === 'social') {
                    const extracted = extractTelegramUsernameOrCode(link);
                    if (!extracted) {
                        showMessage('Invalid Telegram link format.', 'error');
                        setButtonLoading(verifyBtn, false);
                        return;
                    }

                    let chatIdentifier;
                    if (extracted.type === 'username') {
                        chatIdentifier = '@' + extracted.value;

                        const botCheck = await verifyBotIsAdmin(chatIdentifier);
                        if (!botCheck.isAdmin) {
                            showMessage('Bot must be admin in the channel/group to verify.', 'error');
                            setButtonLoading(verifyBtn, false);
                            return;
                        }

                        const userId = getUserId();
                        verified = await verifyTelegramMembership(link, userId);

                        if (!verified) {
                            showMessage('Please join the channel/group first!', 'error');
                            setButtonLoading(verifyBtn, false);
                            return;
                        }
                    } else {
                        verified = true;
                    }
                } else {
                    verified = true;
                }

                // Notify backend to start tracking this channel task
                if ((taskType === 'join_channel' || taskType === 'join_group' || taskType === 'social') && channelUsername) {
                    try {
                        const userId = getUserId();
                        await fetch('https://checker-flame.vercel.app/api/task-accepted', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                user_id: userId,
                                task_id: taskId
                            })
                        });
                    } catch (err) {
                        console.error('Error starting task tracking:', err);
                    }
                }

                const success = await markTaskCompleted(taskId, reward);

                if (success) {
                    completedTaskIds.add(taskId);
                    showMessage(`You earned ${parseFloat(reward).toFixed(8)} Perks!`, 'success');
                    renderTasks();
                } else {
                    showMessage('Failed to complete task. Please try again.', 'error');
                    setButtonLoading(verifyBtn, false);
                }
            } catch (err) {
                console.error('Error verifying task:', err);
                showMessage('An error occurred. Please try again.', 'error');
                setButtonLoading(verifyBtn, false);
            }
        };

        async function init() {
            if (!checkTelegramEnvironment()) return;
            init3DBackground();

            try {
                const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Loading timeout')), 15000));
                await Promise.race([fetchSettings(), timeoutPromise]);
                await Promise.race([fetchUser(), timeoutPromise]);
                if (!currentUser) throw new Error('Unable to load user data');

                const [tasks, completedIds, ads] = await Promise.all([
                    fetchTasks().catch(() => []),
                    fetchCompletedTasks().catch(() => []),
                    fetchActiveAds().catch(() => [])
                ]);

                allTasks = tasks;
                completedTaskIds = new Set(completedIds);
                activeAds = ads;

                renderTasks();
            } catch (err) {
                console.error('Initialization error:', err);
                showLoadingError(err.message || 'Failed to load data.');
            }
        }

        init();
    </script>
</body>
</html>
